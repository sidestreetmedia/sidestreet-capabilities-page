  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-weight:750;font-size:8.333cqw;line-height:.86;letter-spacing:-.055em;margin:2.696cqw 0 0;color:#07131c\">The partner that does <span style=\"font-weight:300;font-style:italic;color:#20618a;letter-spacing:-.035em\">the work.<\u002Fspan><\u002Fh2>\n  <p style=\"font-family:Outfit,sans-serif;font-weight:400;font-size:2.328cqw;line-height:1.4;color:#07131c;margin:4.167cqw 0 0;max-width:80.882cqw;text-wrap:pretty\">Sidestreet is a senior-led creative, marketing, and technology team for organizations that need range without layers. The people you talk to are the people who write, design, shoot, build, and launch — and they stay on the account.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:3.922cqw;margin-top:3.431cqw;font-size:1.532cqw;line-height:1.6;color:#53616a\">\n    <p style=\"margin:0;text-wrap:pretty\">Founded in 2010 and headquartered in Spartanburg, South Carolina, with roots in broadcast news. Our work has reached audiences in more than 150 countries.<\u002Fp>\n    <p style=\"margin:0;text-wrap:pretty\">NBC News Channel has been a Sidestreet client for nearly ten years, and that newsroom pace is why we're fast. AI handles the research and the grind so senior judgment lands on every deliverable.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);margin-top:5.392cqw;border-top:1px solid rgba(7,19,28,.18);border-bottom:1px solid rgba(7,19,28,.18)\">\n    <div style=\"padding:3.431cqw 1.961cqw 3.431cqw 0\"><div style=\"font-family:Outfit,sans-serif;font-weight:700;font-size:6.863cqw;line-height:1;letter-spacing:-.04em;color:#20618a\">400%+<\u002Fdiv><div style=\"font-size:1.287cqw;line-height:1.45;color:#64727a;margin-top:1.225cqw\">Online revenue growth for a national e-commerce manufacturer<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:3.431cqw 1.961cqw;border-left:1px solid rgba(7,19,28,.18)\"><div style=\"font-family:Outfit,sans-serif;font-weight:700;font-size:6.863cqw;line-height:1;letter-spacing:-.04em;color:#20618a\">75–25<\u002Fdiv><div style=\"font-size:1.287cqw;line-height:1.45;color:#64727a;margin-top:1.225cqw\">Countywide campaign win, a 50-point margin<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:3.431cqw 1.961cqw;border-left:1px solid rgba(7,19,28,.18)\"><div style=\"font-family:Outfit,sans-serif;font-weight:700;font-size:6.863cqw;line-height:1;letter-spacing:-.04em;color:#20618a\">150%<\u002Fdiv><div style=\"font-size:1.287cqw;line-height:1.45;color:#64727a;margin-top:1.225cqw\">Month-one social growth for a regional newsroom<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:3.431cqw 0 3.431cqw 1.961cqw;border-left:1px solid rgba(7,19,28,.18)\"><div style=\"font-family:Outfit,sans-serif;font-weight:700;font-size:6.863cqw;line-height:1;letter-spacing:-.04em;color:#20618a\">0<\u002Fdiv><div style=\"font-size:1.287cqw;line-height:1.45;color:#64727a;margin-top:1.225cqw\">Long-term clients with a negative return<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:1.225cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#53616a;margin-top:5.392cqw\">( Some of the company we keep )<\u002Fdiv>\n  <p style=\"font-size:1.532cqw;line-height:1.6;color:#53616a;margin:0.98cqw 0 0\">Networks, manufacturers, agencies, churches, and public bodies. Same senior team on every one.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2.6cqw 2.5cqw;margin-top:2.206cqw;padding:3.2cqw 0;border-top:1px solid rgba(7,19,28,.18);border-bottom:1px solid rgba(7,19,28,.18)\">\n    <sc-for list=\"{{ logos }}\" as=\"logo\" hint-placeholder-count=\"14\">\n      <div style=\"width:15cqw;height:6.4cqw;display:flex;align-items:center;justify-content:center\"><img src=\"{{ logo.src }}\" alt=\"{{ logo.name }}\" style=\"width:{{ logo.w }};height:{{ logo.h }};object-fit:contain;display:block;filter:brightness(0);opacity:.92\"><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:1.225cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#53616a;margin-top:4.902cqw\">Where we go deepest<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(6,1fr);margin-top:1.225cqw;border-top:1px solid rgba(7,19,28,.18);border-bottom:1px solid rgba(7,19,28,.18)\">\n    <div style=\"padding:2.206cqw 1.225cqw 2.206cqw 0;font-size:1.348cqw;line-height:1.35;color:#07131c\">Professional services<\u002Fdiv>\n    <div style=\"padding:1.716cqw 1.225cqw;border-left:1px solid rgba(7,19,28,.18);font-size:1.348cqw;line-height:1.35;color:#07131c\">Healthcare &amp; dental<\u002Fdiv>\n    <div style=\"padding:1.716cqw 1.225cqw;border-left:1px solid rgba(7,19,28,.18);font-size:1.348cqw;line-height:1.35;color:#07131c\">Construction &amp; real estate<\u002Fdiv>\n    <div style=\"padding:1.716cqw 1.225cqw;border-left:1px solid rgba(7,19,28,.18);font-size:1.348cqw;line-height:1.35;color:#07131c\">Churches &amp; nonprofits<\u002Fdiv>\n    <div style=\"padding:1.716cqw 1.225cqw;border-left:1px solid rgba(7,19,28,.18);font-size:1.348cqw;line-height:1.35;color:#07131c\">City &amp; county government<\u002Fdiv>\n    <div style=\"padding:2.206cqw 0 2.206cqw 1.225cqw;border-left:1px solid rgba(7,19,28,.18);font-size:1.348cqw;line-height:1.35;color:#07131c\">Tourism &amp; destination<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:6.863cqw;right:6.863cqw;bottom:4.412cqw;display:flex;justify-content:space-between;font-size:1.164cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#64727a\"><span>Sidestreet capabilities · October 2026<\u002Fspan><span>02 / 06<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"p3\" data-screen-label=\"03 What we do, part one\" style=\"position:relative;overflow:hidden;background:#f7f5f0;color:#07131c;padding:5.882cqw 6.863cqw 8.824cqw;box-sizing:border-box;font-family:Geist,sans-serif\">\n  <div style=\"font-size:1.225cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#53616a\">( 02 — What we do )<\u002Fdiv>\n  <h2 style=\"font-family:Outfit,sans-serif;font-weight:750;font-size:8.333cqw;line-height:.86;letter-spacing:-.055em;margin:2.696cqw 0 0;color:#07131c\">One team. <span style=\"font-weight:300;font-style:italic;color:#20618a;letter-spacing:-.035em\">Full signal.<\u002Fspan><\u002Fh2>\n  <p style=\"font-size:1.593cqw;line-height:1.6;color:#53616a;margin:3.431cqw 0 6.127cqw;max-width:63.725cqw;text-wrap:pretty\">Connected capabilities, not disconnected vendors. We see the whole picture and build the right combination around the problem.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:3.064cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n    <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">01<\u002Fdiv>\n    <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Strategy &amp; digital marketing<\u002Fdiv>\n    <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Search, paid, social, email, and content, run by people who understand the business and are accountable for the results.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">SEO · Google &amp; Meta advertising · Social media management · Email marketing &amp; automation<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:3.064cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n    <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">02<\u002Fdiv>\n    <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Campaigns &amp; media buying<\u002Fdiv>\n    <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Integrated campaigns across digital, print, broadcast, and earned media, planned and bought by people who know how the rates actually work.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Integrated campaign strategy · Traditional &amp; digital media buying · Programmatic · Measurement &amp; attribution<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:3.064cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n    <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">03<\u002Fdiv>\n    <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Content &amp; copywriting<\u002Fdiv>\n    <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Website copy, SEO content, brand messaging, and sales collateral written to do a job, not fill space.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Website &amp; landing page copy · SEO &amp; blog content · Brand voice · Sales &amp; marketing collateral<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:3.064cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n    <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">04<\u002Fdiv>\n    <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Brand &amp; identity<\u002Fdiv>\n    <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Strategy first, then the mark, the system, and the guidelines that keep it consistent for years.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Positioning · Logo design &amp; logo systems · Visual identity · Brand guidelines · Naming &amp; rebrands<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:3.064cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n    <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">05<\u002Fdiv>\n    <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Graphic design &amp; print<\u002Fdiv>\n    <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Collateral, digital and social graphics, large-format, and direct mail, designed and printed by the same team so what you approve is what shows up.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Marketing collateral · Digital &amp; social graphics · Offset, digital &amp; large-format print · Direct mail &amp; fulfillment · Trade show &amp; event graphics<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:3.064cqw 0;border-top:1px solid rgba(7,19,28,.18);border-bottom:1px solid rgba(7,19,28,.18)\">\n    <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">06<\u002Fdiv>\n    <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Web design &amp; development<\u002Fdiv>\n    <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Fast, search-ready custom WordPress sites and e-commerce, with hosting and support that don't disappear after launch.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Custom WordPress · WooCommerce · Managed hosting &amp; maintenance · Custom applications &amp; integrations · CRM &amp; marketing-stack integration<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:6.863cqw;right:6.863cqw;bottom:4.412cqw;display:flex;justify-content:space-between;font-size:1.164cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#64727a\"><span>Sidestreet capabilities · October 2026<\u002Fspan><span>03 / 06<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"p4\" data-screen-label=\"04 What we do, part two\" style=\"position:relative;overflow:hidden;background:#f7f5f0;color:#07131c;box-sizing:border-box;font-family:Geist,sans-serif\">\n  <div style=\"background:#20618a;color:#ffffff;padding:9.069cqw 6.863cqw 8.333cqw;box-sizing:border-box\">\n    <h2 style=\"font-family:Outfit,sans-serif;font-weight:750;font-size:7.108cqw;line-height:.86;letter-spacing:-.055em;margin:0;color:#ffffff;max-width:75.98cqw\">Less overhead. More ownership. <span style=\"font-weight:300;font-style:italic;color:#a9cfe3;letter-spacing:-.035em\">Better work.<\u002Fspan><\u002Fh2>\n    <p style=\"font-size:1.716cqw;line-height:1.6;color:rgba(255,255,255,.65);margin:3.186cqw 0 0\">We stay close enough to care and experienced enough to move.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"padding:2.696cqw 6.863cqw 0\">\n    <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:1.6cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n      <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">07<\u002Fdiv>\n      <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Video production &amp; photography<\u002Fdiv>\n      <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Broadcast-grade brand films, commercial, corporate, and documentary production, plus commercial photography, all in-house.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Brand &amp; commercial video · Commercial photography · FAA-licensed drone &amp; aerial · Event &amp; documentary · Podcast production<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:1.6cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n      <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">08<\u002Fdiv>\n      <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">PR &amp; crisis communications<\u002Fdiv>\n      <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Media relations built on newsroom experience, and a crisis practice that already knows what to do when something goes wrong.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Media relations &amp; press strategy · Crisis planning &amp; response · Spokesperson preparation · Reputation management<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:1.6cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n      <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">09<\u002Fdiv>\n      <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Church &amp; faith media<\u002Fdiv>\n      <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">The full scope for churches: streaming, websites, production, and communications, from people who've run a Sunday themselves.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Live streaming setup &amp; management · Church web design · Sermon &amp; event production · Church marketing, PR &amp; communications<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:1.6cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n      <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">10<\u002Fdiv>\n      <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">Live distribution &amp; streaming channels<\u002Fdiv>\n      <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Newsroom-grade live streaming with backup signal paths and clean feeds for TV stations, and 24/7 branded streaming channels built from your video library.<\u002Fp><div style=\"font-size:1.287cqw;line-height:1.5;color:#64727a;margin-top:0.98cqw\">Multi-platform streaming · Private &amp; ticketed streams · Feeds for TV stations · Channel programming, branding &amp; ad insertion<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:3.922cqw 24.02cqw 1fr;column-gap:2.696cqw;padding:1.6cqw 0;border-top:1px solid rgba(7,19,28,.18)\">\n      <div style=\"font-size:1.348cqw;font-weight:500;letter-spacing:.1em;color:#20618a;padding-top:0.368cqw\">11<\u002Fdiv>\n      <div style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:2.083cqw;line-height:1.15;letter-spacing:-.015em;color:#07131c\">AI phone answering<\u002Fdiv>\n      <div><p style=\"margin:0;font-size:1.471cqw;line-height:1.55;color:#53616a;text-wrap:pretty\">Every call answered, day or night, with natural conversation, appointment booking, smart routing, and every new lead logged in your CRM instead of lost to voicemail.<\u002Fp><div style=\"font-size:1.287cq
